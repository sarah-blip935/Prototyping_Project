
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .ms-wrap { padding: 1.5rem 0; max-width: 680px; }
  .ms-header { display: flex; align-items: center; gap: 14px; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 0.5px solid var(--border); }
  .ms-logo { width: 48px; height: 48px; border-radius: 10px; background: #0057A8; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ms-logo svg { width: 30px; height: 30px; }
  .ms-header-text h1 { font-size: 20px; font-weight: 500; color: var(--text-primary); }
  .ms-header-text p { font-size: 13px; color: var(--text-secondary); margin-top: 3px; }
  .ms-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--bg-accent); color: var(--text-accent); margin-top: 5px; font-weight: 500; }

  .steps-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .step-dot { width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--border-strong); background: var(--surface-1); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all 0.15s; }
  .step-dot:hover { border-color: #0057A8; color: #0057A8; }
  .step-dot.active { background: #0057A8; color: #fff; border-color: #0057A8; }
  .step-dot.done { background: var(--bg-success); color: var(--text-success); border-color: var(--border-success); }

  .step-card { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; }
  .step-card-header { background: #0057A8; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
  .step-num { font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.15); border-radius: 20px; padding: 2px 8px; }
  .step-title { font-size: 16px; font-weight: 500; color: #fff; }
  .step-body { padding: 20px; }

  .visual-block { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .vb-label { font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }

  .cad-screen { background: #1a1f2e; border-radius: 6px; padding: 12px; position: relative; font-family: monospace; }
  .cad-topbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .cad-topbar span { font-size: 11px; color: #7fa8d0; padding: 2px 10px; border-radius: 3px; cursor: default; }
  .cad-topbar span:first-child { background: rgba(0,87,168,0.4); color: #90c4ff; }
  .cad-viewport { width: 100%; height: 140px; background: #141820; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .grid-lines { position: absolute; inset: 0; opacity: 0.12; }
  .cad-label { font-size: 11px; color: #4a7fa5; position: absolute; bottom: 6px; right: 8px; }

  .tools-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tool-chip { font-size: 12px; padding: 4px 10px; border-radius: 6px; background: rgba(0,87,168,0.1); border: 0.5px solid rgba(0,87,168,0.25); color: #0057A8; font-family: monospace; display: flex; align-items: center; gap: 5px; }

  .instructions { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .instructions li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--text-primary); line-height: 1.6; }
  .inst-num { width: 22px; height: 22px; border-radius: 50%; background: #0057A8; color: #fff; font-size: 11px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .key-chip { display: inline-block; background: var(--surface-1); border: 0.5px solid var(--border-strong); border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: monospace; color: var(--text-secondary); }

  .tip-box { display: flex; gap: 10px; background: var(--bg-accent); border: 0.5px solid var(--border-accent); border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
  .tip-box i { color: var(--text-accent); font-size: 16px; margin-top: 1px; flex-shrink: 0; }
  .tip-box p { font-size: 13px; color: var(--text-accent); line-height: 1.5; }

  .nav-btns { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
  .nav-btn { padding: 8px 18px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-1); color: var(--text-primary); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.1s; }
  .nav-btn:hover { background: var(--surface-0); }
  .nav-btn.primary { background: #0057A8; color: #fff; border-color: #0057A8; }
  .nav-btn.primary:hover { background: #004a91; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .progress-text { font-size: 12px; color: var(--text-muted); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .info-cell { background: var(--surface-1); border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .info-cell .ic-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .info-cell .ic-val { font-size: 13px; font-weight: 500; color: var(--text-primary); }

  .feature-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .feature-tag { font-size: 12px; padding: 3px 10px; border-radius: 20px; background: var(--bg-success); color: var(--text-success); border: 0.5px solid var(--border-success); }
</style>

<div class="ms-wrap">
  <div class="ms-header">
    <div class="ms-logo">
      <svg viewBox="0 0 30 30" fill="none">
        <rect x="3" y="3" width="10" height="10" stroke="white" stroke-width="1.5" fill="none"/>
        <rect x="17" y="3" width="10" height="10" stroke="white" stroke-width="1.5" fill="none"/>
        <rect x="3" y="17" width="10" height="10" stroke="white" stroke-width="1.5" fill="none"/>
        <rect x="17" y="17" width="10" height="10" stroke="#7fb8ff" stroke-width="1.5" fill="rgba(127,184,255,0.2)"/>
        <line x1="8" y1="3" x2="22" y2="27" stroke="white" stroke-width="1" opacity="0.4"/>
      </svg>
    </div>
    <div class="ms-header-text">
      <h1>Bentley MicroStation</h1>
      <p>Professional CAD/BIM Software — Step-by-Step Demo</p>
      <span class="ms-badge">Assignment Demo · Sir Noman Mazher</span>
    </div>
  </div>

  <div class="steps-nav" id="stepsNav"></div>

  <div class="step-card" id="stepCard"></div>

  <div class="nav-btns">
    <button class="nav-btn" id="prevBtn" onclick="changeStep(-1)">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Previous
    </button>
    <span class="progress-text" id="progressText"></span>
    <button class="nav-btn primary" id="nextBtn" onclick="changeStep(1)">
      Next <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>

<script>
const steps = [
  {

        <li><span class="inst-num">2</span><span>It supports <strong>AEC (Architecture, Engineering & Construction)</strong> industries — bridges, roads, buildings, and infrastructure projects.</span></li>

let current = 0;
const completed = new Set();

function renderNav() {
  const nav = document.getElementById('stepsNav');
  nav.innerHTML = steps.map((s, i) => 
    `<div class="step-dot ${i === current ? 'active' : completed.has(i) ? 'done' : ''}" onclick="goTo(${i})">${i + 1}</div>`
  ).join('');
}

function renderStep() {
  const s = steps[current];
  document.getElementById('stepCard').innerHTML = `
    <div class="step-card-header">
      <span class="step-num">Step ${current + 1} of ${steps.length}</span>
      <span class="step-title">${s.title}</span>
    </div>
    <div class="step-body">${s.content()}</div>
  `;
  document.getElementById('progressText').textContent = `${current + 1} / ${steps.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').innerHTML = current === steps.length - 1 
    ? 'Finish <i class="ti ti-check" aria-hidden="true"></i>'
    : 'Next <i class="ti ti-arrow-right" aria-hidden="true"></i>';
}

function goTo(i) {
  completed.add(current);
  current = i;
  renderNav();
  renderStep();
}

function changeStep(dir) {
  const next = current + dir;
  if (next >= 0 && next < steps.length) {
    goTo(next);
  }
}

renderNav();
renderStep();
</script>
